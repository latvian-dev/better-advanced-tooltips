plugins {
	id 'fabric-loom'
}

version = rootProject.mod_version
group = rootProject.maven_group
base.archivesName = 'better-advanced-tooltips-fabric'

repositories {
	mavenCentral()
	maven {
		url 'https://maven.parchmentmc.org'
		content { includeGroup 'org.parchmentmc.data' }
	}
	maven {
		url 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
		content { includeGroup 'fuzs.forgeconfigapiport' }
	}
	maven { url 'https://maven.terraformersmc.com/releases' }
}

loom {
	accessWidenerPath = file('src/main/resources/betteradvancedtooltips.accesswidener')
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings loom.layered {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	include modApi("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}")
	include modApi('com.terraformersmc:modmenu:11.0.3')
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	sourceCompatibility = targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'forge_config_api_port_version', rootProject.forge_config_api_port_version
	filesMatching('fabric.mod.json') {
		expand version: project.version, forge_config_api_port_version: rootProject.forge_config_api_port_version
	}
}

tasks.withType(Jar).configureEach {
	from('LICENSE')
}

test {
	useJUnitPlatform()
}
